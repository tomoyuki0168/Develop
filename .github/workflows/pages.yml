# 天津神・国津神 図鑑 を GitHub Pages に公開する
#
# 公開元は「GitHub Actions」。リポジトリの Settings → Pages で
# Source を GitHub Actions にしておくこと（初回のみ手作業が要る）。
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 配布用の1ファイルをビルドする
        run: node build.js

      - name: データの整合性を確かめる
        run: |
          node -e "
          const d = require('./data/deities.js');
          const ids = new Set(d.map(x => x.id));
          const bad = new Set();
          d.forEach(x => [...x.parents, ...x.spouse, ...x.children]
            .forEach(r => { if (!ids.has(r)) bad.add(r); }));
          const dup = d.map(x => x.id).filter((v, i, a) => a.indexOf(v) !== i);
          if (bad.size || dup.length) {
            console.error('参照切れ:', [...bad].join(',') || 'なし', '/ id重複:', dup.join(',') || 'なし');
            process.exit(1);
          }
          console.log('柱数:', d.length, '— 整合性に問題なし');
          "

      - name: 翻訳の抜けを確かめる
        run: |
          node -e "
          global.window = {};
          ['en', 'zh-Hans', 'zh-Hant', 'ko'].forEach(c => require('./data/i18n/' + c + '.js'));
          const d = require('./data/deities.js');
          const u = k => [...new Set(d.flatMap(x => x[k] || []))].filter(v => v !== '—');
          const need = [...u('benefits'), ...u('myths'), ...u('tags'), ...u('sources')];
          let ng = 0;
          Object.entries(global.window.I18N).forEach(([code, t]) => {
            const mt = need.filter(v => !t.terms[v]);
            const md = d.filter(x => !t.deities[x.id]);
            if (mt.length || md.length) {
              console.error(code, '未訳の語彙', mt.length, '/ 未訳の神格', md.length);
              ng++;
            }
          });
          if (ng) process.exit(1);
          console.log('翻訳の抜けなし（4言語 × 神格', d.length, '柱）');
          "

      - name: 配信する内容を集める
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/assets _site/data/i18n _site/dist
          cp index.html                 _site/
          cp assets/styles.css          _site/assets/
          cp assets/app.js              _site/assets/
          cp data/deities.js            _site/data/
          cp data/i18n/*.js             _site/data/i18n/
          cp dist/kamigami-zukan.html   _site/dist/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
